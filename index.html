<script> "use strict";

/* ========================================================= STORAGE ========================================================= */

const STORAGEKEY = "spendlytransactions_v2";

let transactions = [];

try { const stored = localStorage.getItem(STORAGE_KEY);

if (stored) { const parsed = JSON.parse(stored);

if (Array.isArray(parsed)) { transactions = parsed; } } } catch (error) { transactions = []; }

let currentType = "expense";

/* ========================================================= DOM ========================================================= */

const modal = document.getElementById("modal"); const modalContent = document.getElementById("modalContent");

const titleInput = document.getElementById("title"); const amountInput = document.getElementById("amount"); const categoryInput = document.getElementById("category");

const expenseButton = document.getElementById("expenseButton");

const incomeButton = document.getElementById("incomeButton");

const addButton = document.getElementById("addButton");

const cancelButton = document.getElementById("cancelButton");

const saveButton = document.getElementById("saveButton");

/* ========================================================= MONEY ========================================================= */

function formatMoney(amount) {

return new Intl.NumberFormat("en-IN", { style: "currency", currency: "INR", maximumFractionDigits: 0 }).format(amount); }

/* ========================================================= IOS SAFE HAPTICS ========================================================= */

function haptic(type = "light") {

/* iOS Safari normally does not expose navigator.vibrate. Android browsers may support it.

This function therefore safely uses vibration when available and otherwise does nothing. */

try {

if ("vibrate" in navigator) {

if (type === "success") { navigator.vibrate([20, 30, 40]); }

else if (type === "error") { navigator.vibrate([35, 25, 35]); }

else { navigator.vibrate(12); } }

} catch (error) { // Optional feature. } }

/* ========================================================= TYPE ========================================================= */

function setType(type) {

currentType = type;

expenseButton.classList.remove( "active-expense" );

incomeButton.classList.remove( "active-income" );

if (type === "expense") {

expenseButton.classList.add( "active-expense" );

} else {

incomeButton.classList.add( "active-income" ); } }

/* ========================================================= OPEN MODAL ========================================================= */

function openModal() {

modal.classList.add("active");

modal.setAttribute( "aria-hidden", "false" );

document.body.style.overflow = "hidden";

haptic();

setTimeout(() => {

titleInput.focus();

}, 300); }

/* ========================================================= CLOSE MODAL ========================================================= */

function closeModal() {

modal.classList.remove("active");

modal.setAttribute( "aria-hidden", "true" );

document.body.style.overflow = "";

titleInput.value = ""; amountInput.value = ""; categoryInput.value = "Food";

setType("expense"); }

/* ========================================================= SAVE DATA ========================================================= */

function saveData() {

try {

localStorage.setItem( STORAGE_KEY, JSON.stringify(transactions) );

return true;

} catch (error) {

console.error( "Spendly storage error:", error );

alert( "Spendly could not save this transaction." );

return false; } }

/* ========================================================= SAVE TRANSACTION ========================================================= */

function saveTransaction() {

const title = titleInput.value.trim();

const amount = Number(amountInput.value);

const category = categoryInput.value;

if (!title) {

alert( "Please enter a description." );

titleInput.focus();

return; }

if ( !Number.isFinite(amount) || amount <= 0 ) {

alert( "Please enter a valid amount." );

amountInput.focus();

return; }

const transaction = {

id: Date.now().toString() + Math.random() .toString(36) .slice(2),

title: title,

amount: amount,

type: currentType,

category: category,

date: new Date().toISOString() };

transactions.unshift(transaction);

if (!saveData()) { return; }

const savedType = currentType;

closeModal();

render();

if (savedType === "income") {

showIncomeReward(amount);

} else {

showExpenseLoss(amount); } }

/* ========================================================= DELETE ========================================================= */

function deleteTransaction(id) {

const transaction = transactions.find( item => String(item.id) === String(id) );

if (!transaction) { return; }

transactions = transactions.filter( item => String(item.id) !== String(id) );

saveData();

render();

haptic(); }

/* ========================================================= CLEAR ========================================================= */

function clearAll() {

if (transactions.length === 0) {

alert( "There are no transactions to clear." );

return; }

const confirmed = confirm( "Delete all transactions?" );

if (!confirmed) { return; }

transactions = [];

saveData();

render();

haptic("error"); }

/* ========================================================= ICON ========================================================= */

function getIcon(category) {

const icons = {

Food: "🍔", Transport: "🚗", Shopping: "🛍️", Bills: "📄", Entertainment: "🎬", Health: "❤️", Other: "💰" };

return icons[category] || "💰"; }

/* ========================================================= HTML SAFETY ========================================================= */

function escapeHTML(value) {

const div = document.createElement("div");

div.textContent = String(value);

return div.innerHTML; }

/* ========================================================= RENDER ========================================================= */

function render() {

let income = 0; let expenses = 0;

transactions.forEach(transaction => {

const amount = Number(transaction.amount) || 0;

if (transaction.type === "income") {

income += amount;

} else {

expenses += amount; } });

const balance = income - expenses;

document.getElementById("balance") .textContent = formatMoney(balance);

document.getElementById("income") .textContent = formatMoney(income);

document.getElementById("expenses") .textContent = formatMoney(expenses);

document.getElementById("transactionCount") .textContent = transactions.length ? transactions.length : "";

const container = document.getElementById( "transactions" );

if (transactions.length === 0) {

container.innerHTML = ` <div class="empty">

<div class="empty-icon"> 💳 </div>

<div class="empty-title"> No transactions yet </div>

<div class="empty-subtitle"> Tap + to add your first transaction. </div>

</div> `;

return; }

container.innerHTML = transactions.map(transaction => {

const isIncome = transaction.type === "income";

const sign = isIncome ? "+" : "-";

const color = isIncome ? "income" : "expense";

return ` <div class="transaction">

<div class="transaction-icon"> ${getIcon(transaction.category)} </div>

<div class="transaction-info">

<div class="transaction-title"> ${escapeHTML(transaction.title)} </div>

<div class="transaction-category"> ${escapeHTML(transaction.category)} </div>

</div>

<div class="transaction-right">

<div class=" transaction-amount ${color} "> 
s
i
g
n
{formatMoney( Number(transaction.amount) )} </div>

<button class="delete-button" data-delete-id="${escapeHTML(transaction.id)}" aria-label="Delete transaction" type="button"> 🗑️ </button>

</div>

</div> `;

}).join("");

container .querySelectorAll("[data-delete-id]") .forEach(button => {

button.addEventListener( "click", event => {

event.preventDefault(); event.stopPropagation();

deleteTransaction( button.dataset.deleteId ); } );

}); }

/* ========================================================= INCOME REWARD ========================================================= */

function showIncomeReward(amount) {

const container = document.getElementById( "celebration" );

container.innerHTML = "";

const glow = document.createElement("div");

glow.className = "reward-glow";

container.appendChild(glow);

const message = document.createElement("div");

message.className = "reward-message income";

message.textContent = 💰 +${formatMoney(amount)} Added!;

container.appendChild(message);

const coins = [ "🪙", "💰", "🪙", "💵", "🪙", "✨", "💰", "🪙" ];

coins.forEach((coin, index) => {

const element = document.createElement("div");

element.className = "coin";

element.textContent = coin;

const angle = (Math.PI * 2 / coins.length) * index;

const distance = 90 + Math.random() * 110;

element.style.setProperty( "--x", ${Math.cos(angle) * distance}px );

element.style.setProperty( "--y", ${Math.sin(angle) * distance}px );

element.style.setProperty( "--rotation", ${Math.random() * 720 - 360}deg );

container.appendChild(element); });

haptic("success");

setTimeout(() => {

container.innerHTML = "";

}, 1600); }

/* ========================================================= EXPENSE LOSS ========================================================= */

function showExpenseLoss(amount) {

const container = document.getElementById( "celebration" );

container.innerHTML = "";

const flash = document.createElement("div");

flash.className = "loss-flash";

container.appendChild(flash);

const message = document.createElement("div");

message.className = "reward-message expense";

message.textContent = 💸 -${formatMoney(amount)};

container.appendChild(message);

const coins = [ "💸", "🪙", "💸", "🪙", "💸" ];

coins.forEach((coin, index) => {

const element = document.createElement("div");

element.className = "loss-coin";

element.textContent = coin;

element.style.setProperty( "--x", ${(index - 2) * 70}px );

container.appendChild(element); });

const app = document.querySelector(".app");

app.classList.remove("shake");

void app.offsetWidth;

app.classList.add("shake");

setTimeout(() => {

app.classList.remove("shake");

}, 500);

haptic("error");

setTimeout(() => {

container.innerHTML = "";

}, 1500); }

/* ========================================================= EVENTS ========================================================= */

addButton.addEventListener( "click", openModal );

cancelButton.addEventListener( "click", closeModal );

saveButton.addEventListener( "click", saveTransaction );

document .getElementById("clearButton") .addEventListener( "click", clearAll );

expenseButton.addEventListener( "click", () => setType("expense") );

incomeButton.addEventListener( "click", () => setType("income") );

/* ========================================================= BACKDROP ========================================================= */

modal.addEventListener( "click", event => {

if (event.target === modal) { closeModal(); }

} );

/* ========================================================= ESCAPE ========================================================= */

document.addEventListener( "keydown", event => {

if (event.key === "Escape") { closeModal(); }

} );

/* ========================================================= ENTER ========================================================= */

titleInput.addEventListener( "keydown", event => {

if (event.key === "Enter") {

event.preventDefault();

amountInput.focus(); }

} );

amountInput.addEventListener( "keydown", event => {

if (event.key === "Enter") {

event.preventDefault();

saveTransaction(); }

} );

/* ========================================================= IOS KEYBOARD FIX ========================================================= */

if (window.visualViewport) {

window.visualViewport.addEventListener( "resize", () => {

if ( modal.classList.contains("active") ) {

setTimeout(() => {

const active = document.activeElement;

if ( active === titleInput || active === amountInput ) {

active.scrollIntoView({ behavior: "smooth", block: "center" }); }

}, 50); }

} ); }

/* ========================================================= INITIALIZE ========================================================= */

render(); </script>
