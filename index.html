<script>

/* ========================================================= STORAGE ========================================================= */

const STORAGEKEY = "spendlytransactions_v2";

let transactions = [];

try {

const saved = localStorage.getItem(STORAGE_KEY);

if (saved) { transactions = JSON.parse(saved); }

if (!Array.isArray(transactions)) { transactions = []; }

} catch (error) {

transactions = [];

}

/* ========================================================= STATE ========================================================= */

let currentType = "expense";

let lastTouchTime = 0;

/* ========================================================= DOM ========================================================= */

const modal = document.getElementById("modal");

const addButton = document.getElementById("addButton");

const titleInput = document.getElementById("title");

const amountInput = document.getElementById("amount");

const categoryInput = document.getElementById("category");

const expenseButton = document.getElementById("expenseButton");

const incomeButton = document.getElementById("incomeButton");

const saveButton = document.getElementById("saveButton");

const cancelButton = document.getElementById("cancelButton");

const clearButton = document.getElementById("clearButton");

const celebration = document.getElementById("celebration");

/* ========================================================= MONEY ========================================================= */

function formatMoney(amount) {

return new Intl.NumberFormat( "en-IN", { style: "currency", currency: "INR", maximumFractionDigits: 0 } ).format(amount);

}

/* ========================================================= HAPTICS ========================================================= */

function vibrate(pattern) {

try {

if ( navigator && typeof navigator.vibrate === "function" ) {

navigator.vibrate(pattern);

}

} catch (error) {

// iOS Safari does not expose navigator.vibrate. }

}

/* ========================================================= SET TYPE ========================================================= */

function setType(type) {

currentType = type;

expenseButton.className = "type-button" + ( type === "expense" ? " active-expense" : "" );

incomeButton.className = "type-button" + ( type === "income" ? " active-income" : "" );

}

/* ========================================================= OPEN MODAL ========================================================= */

function openModal() {

modal.classList.add("active");

modal.setAttribute( "aria-hidden", "false" );

document.body.style.overflow = "hidden";

vibrate(10);

}

/* ========================================================= CLOSE MODAL ========================================================= */

function closeModal() {

modal.classList.remove("active");

modal.setAttribute( "aria-hidden", "true" );

document.body.style.overflow = "";

titleInput.value = "";

amountInput.value = "";

categoryInput.value = "Food";

setType("expense");

}

/* ========================================================= SAFE HTML ========================================================= */

function escapeHTML(text) {

const element = document.createElement("div");

element.textContent = text;

return element.innerHTML;

}

/* ========================================================= CATEGORY ICON ========================================================= */

function getIcon(category) {

const icons = {

Food: "🍔", Transport: "🚗", Shopping: "🛍️", Bills: "📄", Entertainment: "🎬", Health: "❤️", Other: "💰"

};

return icons[category] || "💰";

}

/* ========================================================= SAVE DATA ========================================================= */

function saveData() {

try {

localStorage.setItem( STORAGE_KEY, JSON.stringify(transactions) );

} catch (error) {

console.error( "Unable to save data:", error );

}

}

/* ========================================================= SAVE TRANSACTION ========================================================= */

function saveTransaction() {

const title = titleInput.value.trim();

const amount = Number(amountInput.value);

const category = categoryInput.value;

if (!title) {

alert( "Please enter a description." );

return;

}

if ( !Number.isFinite(amount) || amount <= 0 ) {

alert( "Please enter a valid amount." );

return;

}

const transaction = {

id: Date.now().toString() + Math.random() .toString(36) .substring(2),

title: title,

amount: amount,

type: currentType,

category: category,

date: new Date().toISOString()

};

transactions.unshift(transaction);

saveData();

render();

const savedType = currentType;

closeModal();

if (savedType === "income") {

showIncomeReward(amount);

} else {

showExpenseLoss(amount);

}

}

/* ========================================================= DELETE ========================================================= */

function deleteTransaction(id) {

transactions = transactions.filter( item => String(item.id) !== String(id) );

saveData();

render();

vibrate(20);

}

/* ========================================================= CLEAR ========================================================= */

function clearAll() {

if (transactions.length === 0) {

alert( "There are no transactions to clear." );

return;

}

const confirmed = window.confirm( "Delete all transactions?" );

if (!confirmed) { return; }

transactions = [];

saveData();

render();

vibrate([30,40,30]);

}

/* ========================================================= RENDER ========================================================= */

function render() {

let income = 0;

let expenses = 0;

transactions.forEach( transaction => {

const amount = Number(transaction.amount) || 0;

if ( transaction.type === "income" ) {

income += amount;

} else {

expenses += amount;

}

} );

const balance = income - expenses;

document.getElementById("balance") .textContent = formatMoney(balance);

document.getElementById("income") .textContent = formatMoney(income);

document.getElementById("expenses") .textContent = formatMoney(expenses);

document.getElementById("transactionCount") .textContent = transactions.length ? ${transactions.length} : "";

const container = document.getElementById( "transactions" );

if (transactions.length === 0) {

container.innerHTML = `

<div class="empty">

<div class="empty-icon"> 💳 </div>

<div class="empty-title"> No transactions yet </div>

<div class="empty-subtitle"> Tap + to add your first transaction. </div>

</div>

`;

return;

}

container.innerHTML = transactions.map( transaction => {

const isIncome = transaction.type === "income";

const sign = isIncome ? "+" : "-";

const color = isIncome ? "income" : "expense";

return `

<div class="transaction">

<div class="transaction-icon"> ${getIcon( transaction.category )} </div>

<div class="transaction-info">

<div class="transaction-title"> ${escapeHTML( transaction.title )} </div>

<div class="transaction-category"> ${escapeHTML( transaction.category )} </div>

</div>

<div class="transaction-right">

<div class=" transaction-amount ${color} "> 
s
i
g
n
{formatMoney( Number( transaction.amount ) )} </div>

<button type="button" class="delete-button" data-delete-id="${transaction.id}" aria-label="Delete transaction"> 🗑️ </button>

</div>

</div>

`;

} ).join("");

container .querySelectorAll( "[data-delete-id]" ) .forEach(button => {

button.addEventListener( "click", function(event) {

event.stopPropagation();

deleteTransaction( button.dataset.deleteId );

} );

});

}

/* ========================================================= INCOME REWARD ========================================================= */

function showIncomeReward(amount) {

celebration.innerHTML = "";

const glow = document.createElement("div");

glow.className = "reward-glow";

celebration.appendChild(glow);

const message = document.createElement("div");

message.className = "reward-message income";

message.textContent = 💰 +${formatMoney(amount)} Added!;

celebration.appendChild(message);

const coins = [ "🪙", "💰", "🪙", "💵", "🪙", "✨", "💰", "🪙" ];

coins.forEach( (coin, index) => {

const element = document.createElement("div");

element.className = "coin";

element.textContent = coin;

const angle = (Math.PI * 2 / coins.length) * index;

const distance = 90 + Math.random() * 110;

element.style.setProperty( "--x", ${Math.cos(angle) * distance}px );

element.style.setProperty( "--y", ${Math.sin(angle) * distance}px );

element.style.setProperty( "--rotation", ${Math.random() * 720 - 360}deg );

celebration.appendChild(element);

} );

vibrate([25,35,50]);

setTimeout( () => { celebration.innerHTML = ""; }, 1600 );

}

/* ========================================================= EXPENSE LOSS ========================================================= */

function showExpenseLoss(amount) {

celebration.innerHTML = "";

const flash = document.createElement("div");

flash.className = "loss-flash";

celebration.appendChild(flash);

const message = document.createElement("div");

message.className = "reward-message expense";

message.textContent = 💸 -${formatMoney(amount)};

celebration.appendChild(message);

const coins = [ "💸", "🪙", "💸", "🪙", "💸" ];

coins.forEach( (coin,index) => {

const element = document.createElement("div");

element.className = "loss-coin";

element.textContent = coin;

element.style.setProperty( "--x", ${(index - 2) * 70}px );

celebration.appendChild(element);

} );

const app = document.querySelector(".app");

app.classList.add("shake");

setTimeout( () => { app.classList.remove("shake"); }, 500 );

vibrate([35,25,35]);

setTimeout( () => { celebration.innerHTML = ""; }, 1500 );

}

/* ========================================================= RELIABLE TOUCH HANDLER ========================================================= */

function touchButton(element, action) {

let handled = false;

element.addEventListener( "touchend", function(event) {

event.preventDefault();

handled = true;

lastTouchTime = Date.now();

action();

}, { passive: false } );

element.addEventListener( "click", function(event) {

/* * iPhone can fire click after touchend. * Prevent the action from happening twice. */

if ( handled && Date.now() - lastTouchTime < 700 ) {

handled = false;

return;

}

action();

} );

}

/* ========================================================= BUTTON EVENTS ========================================================= */

/*

IMPORTANT:
The + button uses touchend + click.
This makes it much more reliable in iOS Safari.
*/

touchButton( addButton, openModal );

touchButton( cancelButton, closeModal );

touchButton( saveButton, saveTransaction );

touchButton( clearButton, clearAll );

touchButton( expenseButton, function() { setType("expense"); } );

touchButton( incomeButton, function() { setType("income"); } );

/* ========================================================= MODAL BACKDROP ========================================================= */

modal.addEventListener( "touchend", function(event) {

if ( event.target === modal ) {

event.preventDefault();

closeModal();

}

}, { passive: false } );

modal.addEventListener( "click", function(event) {

if ( event.target === modal ) {

closeModal();

}

} );

/* ========================================================= ESCAPE ========================================================= */

document.addEventListener( "keydown", function(event) {

if ( event.key === "Escape" ) {

closeModal();

}

} );

/* ========================================================= ENTER ========================================================= */

titleInput.addEventListener( "keydown", function(event) {

if ( event.key === "Enter" ) {

amountInput.focus();

}

} );

amountInput.addEventListener( "keydown", function(event) {

if ( event.key === "Enter" ) {

saveTransaction();

}

} );

/* ========================================================= INITIALIZE ========================================================= */

render();

</script>
